services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: laravel_app
    working_dir: /var/www/html
    # Podman rootless: tu usuario del host se mapea a www-data (33) y el contenedor corre como el,
    # asi todo lo que escriben php-fpm y artisan queda a tu nombre (evita "touch(): Utime failed").
    userns_mode: "keep-id:uid=33,gid=33"
    user: "33:33"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./:/var/www/html:Z
    extra_hosts:
      - "host.containers.internal:host-gateway"
    networks:
      - laravel

  # Compila los assets de Vite a public/build y los recompila al cambiar CSS, JS o vistas Blade.
  # El proyecto va montado como volumen, por eso se compila aqui y no dentro de la imagen.
  vite:
    image: docker.io/library/node:22-alpine
    container_name: laravel_vite
    working_dir: /app
    userns_mode: "keep-id"
    command: sh -c "[ -d node_modules ] || npm ci --no-audit --no-fund; npm run build -- --watch"
    volumes:
      - ./:/app:Z

  webserver:
    image: docker.io/library/nginx:alpine
    container_name: laravel_nginx
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:Z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
